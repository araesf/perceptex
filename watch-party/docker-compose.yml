version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: watchparty-mongo
    restart: unless-stopped
    # MongoDB port NOT exposed to host - only accessible on internal docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - watchparty-network

  app:
    build: .
    container_name: watchparty-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/watchparty?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    depends_on:
      - mongodb
    networks:
      - watchparty-network

volumes:
  mongodb_data:

networks:
  watchparty-network:
    driver: bridge
